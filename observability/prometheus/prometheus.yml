global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']

  # Week 4+: Airflow StatsD exporter (if configured)
  # - job_name: airflow
  #   static_configs:
  #     - targets: ['airflow-webserver:8093']
