version: 2

models:
  - name: mart_standings
    description: "AL/NL standings with division and league rank — ready for dashboard"
    columns:
      - name: team_id
        tests: [not_null, unique]
      - name: division_rank
        tests: [not_null]
      - name: league_rank
        tests: [not_null]

  - name: mart_game_results
    description: "Season game results — winning_team is null for in-progress games"
    columns:
      - name: game_pk
        tests: [not_null, unique]

  - name: mart_player_stats
    description: "Full season batting leaderboard from official MLB stats — min 10 plate appearances"
    columns:
      - name: player_id
        tests: [not_null, unique]

  - name: mart_pitching_leaders
    description: "Full season pitching leaderboard from official MLB stats — starters and relievers"
    columns:
      - name: player_id
        tests: [not_null, unique]

