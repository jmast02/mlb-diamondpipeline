version: 2

sources:
  - name: raw
    schema: public
    description: "Raw data loaded from the MLB Stats API via Kafka consumer"

    tables:
      - name: raw_teams
        description: "MLB team reference data — 30 teams, refreshed each ingestion run"
        columns:
          - name: team_id
            tests: [not_null, unique]
          - name: team_name
            tests: [not_null]
          - name: league_name
            tests: [not_null]
          - name: division_name
            tests: [not_null]

      - name: raw_standings
        description: "Current AL/NL division standings snapshot"
        columns:
          - name: team_id
            tests: [not_null, unique]
          - name: wins
            tests: [not_null]
          - name: losses
            tests: [not_null]
          - name: win_pct
            tests: [not_null]

      - name: raw_schedule
        description: "MLB game schedule — appends across days, deduplicated in stg_schedule"
        columns:
          - name: game_pk
            tests: [not_null]
          - name: home_team_id
            tests: [not_null]
          - name: away_team_id
            tests: [not_null]
          - name: status
            tests: [not_null]

      - name: raw_hitting_stats
        description: "Official MLB season hitting stats for all players — from /api/v1/stats"
        columns:
          - name: player_id
            tests: [not_null]
          - name: player_name
            tests: [not_null]

      - name: raw_pitching_stats
        description: "Official MLB season pitching stats for all players — from /api/v1/stats"
        columns:
          - name: player_id
            tests: [not_null]
          - name: player_name
            tests: [not_null]

      - name: raw_game_events
        description: "Play-by-play events streamed via Kafka — one row per at-bat. Incomplete in-progress plays may have null event_type."
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        loaded_at_field: "end_time::timestamp"
        columns:
          - name: game_pk
            tests: [not_null]
          - name: at_bat_index
            tests: [not_null]
          - name: batter_id
            tests: [not_null]
          - name: pitcher_id
            tests: [not_null]
